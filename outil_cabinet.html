    const CHUNK_SIZE = 900000; // marge de sécurité sous la limite de 1 Mo par document Firestore

    async function saveShared(key, payload) {
      const str = JSON.stringify(payload);
      const parts = [];
      for (let i = 0; i < str.length; i += CHUNK_SIZE) parts.push(str.slice(i, i + CHUNK_SIZE));
      const batch = db.batch();
      batch.set(db.collection('classeur_meta').doc(key), { chunks: parts.length, updatedAt: Date.now() });
      parts.forEach((p, i) => {
        batch.set(db.collection('classeur_chunks').doc(key + '__' + i), { v: p });
      });
      await batch.commit();
    }
    async function loadShared(key) {
      try {
        const metaSnap = await db.collection('classeur_meta').doc(key).get();
        if (!metaSnap.exists) return null;
        const n = metaSnap.data().chunks || 0;
        if (n === 0) return null;
        const snaps = await Promise.all(
          Array.from({ length: n }, (_, i) => db.collection('classeur_chunks').doc(key + '__' + i).get())
        );
        const str = snaps.map((s) => (s.exists ? s.data().v : '')).join('');
        return str ? JSON.parse(str) : null;
      } catch (e) {
        return null;
      }
    }

// ---------- Helpers génériques ----------
function clean(x) {
  if (x === undefined || x === null) return '';
  if (typeof x === 'string' && x.trim().startsWith('#')) return '';
  return x;
}
function v(ws, colLetter, row) {
  if (!ws) return '';
  const c = ws[colLetter + row];
  return c ? clean(c.v) : '';
}
function num(x) {
  const c = clean(x);
  if (c === '' || c === null || c === undefined) return NaN;
  return Number(c);
}
function fmtPct(x) {
  const n = num(x);
  if (isNaN(n)) return '—';
  const pct = n * 100;
  const s = pct.toLocaleString('fr-FR', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
  return `${pct > 0 ? '+' : ''}${s} %`;
}
function fmtEur(x) {
  const n = num(x);
  if (isNaN(n)) return '—';
  return `${n.toLocaleString('fr-FR', { maximumFractionDigits: 0 })} €`;
}
function fmtNum(x, d = 2) {
  const n = num(x);
  if (isNaN(n)) return '—';
  return n.toLocaleString('fr-FR', { maximumFractionDigits: d });
}
function isPercentHeader(col) {
  return /%|perf|rendement|variation|évolution|evolution|var\./i.test(col);
}
function isCurrencyHeader(col) {
  return /€|eur|montant|capital|patrimoine|encours/i.test(col) && !isPercentHeader(col);
}
function fmtPoids(x) {
  const n = num(x);
  if (isNaN(n)) return '—';
  return `${(n * 100).toLocaleString('fr-FR', { maximumFractionDigits: 1 })} %`;
}

function SriBadge({ level }) {

}
function pillTone(text) {
  const t = String(text || '').toLowerCase();
  if (/tendu|baisse|risque|surchauffe/.test(t)) return 'warn';
  if (/attractif|décote|decote|solide|rebond|fort|hausse|surprise/.test(t)) return 'pos';
  return 'neu';
}
function Pill({ text }) {
  if (!text) return <span>—</span>;
  return <span className={`cb-pill-tag cb-pill-${pillTone(text)}`}>{text}</span>;
}
function PctCell({ x }) {
  const n = num(x);
  if (isNaN(n)) return <span className="cb-muted">—</span>;
  return <span className={n >= 0 ? 'cb-pos' : 'cb-neg'}>{fmtPct(x)}</span>;
}

}
function KpiTile({ value, label, sub }) {

    </div>

}
const HEAT_RED = [224, 138, 125];
const HEAT_YELLOW = [242, 213, 126];
const HEAT_GREEN = [143, 199, 154];
function heatColor(ratio) {
  const t = Math.max(0, Math.min(1, ratio));
  let c;
  if (t < 0.5) {
    const s = t / 0.5;
    c = HEAT_RED.map((v, i) => Math.round(v + (HEAT_YELLOW[i] - v) * s));
  } else {
    const s = (t - 0.5) / 0.5;
    c = HEAT_YELLOW.map((v, i) => Math.round(v + (HEAT_GREEN[i] - v) * s));
  }
  return `rgb(${c[0]},${c[1]},${c[2]})`;
}
function HeatCell({ value, ratio }) {
  const n = num(value);
  if (isNaN(n)) return <td className="cb-heat-empty">—</td>;
  const bg = heatColor(ratio);
  const decimals = Number.isInteger(n) ? 0 : 3;
  return <td className="cb-heat" style={{ background: bg, color: INK }}>{fmtNum(n, decimals)}</td>;
}

  { key: 'Perf 3 ans', label: '3 ans', type: 'pct' },
  { key: 'Perf 5 ans', label: '5 ans', type: 'pct' },
  { key: 'Frais courants', label: 'Frais', type: 'pct' },
];
function extractPerformances(wb) {
  const sheetName = wb.SheetNames.find((n) => /perfor/i.test(n)) || wb.SheetNames[0];
  const ws = wb.Sheets[sheetName];
  const rows = XLSX.utils.sheet_to_json(ws, { defval: '' });
  const groups = [];
  let current = null;
  rows.forEach((r) => {
    const hasIsin = String(r['Code ISIN'] || '').trim() !== '';
    if (!hasIsin && r['Fonds']) {
      current = { category: r['Fonds'], funds: [] };
      groups.push(current);
    } else if (hasIsin) {
      if (!current) { current = { category: '', funds: [] }; groups.push(current); }
      current.funds.push(r);
    }
  });
  return { groups };
}
function PerfCell({ col, row }) {
  const raw = row[col.key];
  switch (col.type) {
    case 'stars': return <Stars n={raw} />;
    case 'sri': return <SriBadge level={raw} />;
    case 'pct': return <PctCell x={raw} />;
    case 'num2': return <span className="cb-num-inline">{fmtNum(raw, 2)}</span>;
    case 'isin': return <span className="cb-isin">{raw}</span>;
    default: return <span>{raw || '—'}</span>;
  }
}
function PerformancesView({ data }) {
  const groups = (data && data.groups) || [];
  if (!groups.length) return <p className="cb-muted">Aucune ligne de fonds trouvée dans la feuille "Performances".</p>;

        <tbody>

  );
}

// EXTRACTION — Comparaison de fonds (Comparaison_type.xlsx)
// ============================================================
const FUND_COLS = ['B', 'C', 'D', 'E', 'F'];
function labelIndex(ws, maxRow) {
  const rows = [];
  for (let r = 1; r <= maxRow; r++) {
    const lab = v(ws, 'A', r);
    if (lab) rows.push({ row: r, label: String(lab) });
  }
  return rows;
}
function findLabelRow(idx, re) {
  const f = idx.find((x) => re.test(x.label));
  return f ? f.row : null;
}
function findFundHeaderRow(ws, beforeRow) {
  let best = { row: 2, count: 0 };
  for (let r = 1; r < beforeRow; r++) {
    const count = FUND_COLS.filter((c) => v(ws, c, r) !== '').length;
    if (count > best.count) best = { row: r, count };
  }
  return best.row;
}
function extractComparaison(wb) {
  const wsCard = wb.Sheets['Comparaison OPCVM'] || wb.Sheets[wb.SheetNames[0]];
  const idx = labelIndex(wsCard, 40);

  const pays = [1, 2, 3, 4, 5].map((n) => findLabelRow(idx, new RegExp(`^${n}(er|e)\\s*pays`, 'i')));
  const secteurs = [1, 2, 3, 4, 5].map((n) => findLabelRow(idx, new RegExp(`^${n}(er|e)\\s*secteur`, 'i')));
  const isinRow = findLabelRow(idx, /isin/i);
  const biaisRow = findLabelRow(idx, /Biais g[ée]ographique/i);
  const particularitesRow = findLabelRow(idx, /Particularit/i);
  const concentrationRow = findLabelRow(idx, /^Concentration/i);
  const positionRows = idx.filter((x) => /^Position\s*\d+/i.test(x.label)).map((x) => x.row);

  const anchorRow = pays[0] || isinRow || 6;
  const headerRow = findFundHeaderRow(wsCard, anchorRow);
  const fundCols = FUND_COLS.filter((c) => v(wsCard, c, headerRow) !== '');

  const funds = fundCols.map((c) => ({
    name: v(wsCard, c, headerRow),
    isin: isinRow ? v(wsCard, c, isinRow) : '',
    geo: pays.map((r) => (r ? v(wsCard, c, r) : '')).filter(Boolean),
    biaisGeo: biaisRow ? v(wsCard, c, biaisRow) : '',
    sect: secteurs.map((r) => (r ? v(wsCard, c, r) : '')).filter(Boolean),
    particularites: particularitesRow ? v(wsCard, c, particularitesRow) : '',
    positions: positionRows.map((r) => v(wsCard, c, r)).filter(Boolean),
    concentration: concentrationRow ? v(wsCard, c, concentrationRow) : '',
  }));

  const wsMat = wb.Sheets['Matrices corrélations'];
  const matrices = [];
  const synth = [];
  if (wsMat) {
    const matIdx = labelIndex(wsMat, 60);
    const blockDefs = [
      { title: 'Corrélation géographique', re: /CORR[EÉ]LATION G[EÉ]OGRAPHIQUE/i },
      { title: 'Corrélation sectorielle', re: /CORR[EÉ]LATION SECTORIELLE/i },
      { title: 'Chevauchement des positions', re: /CHEVAUCHEMENT/i },
      { title: 'Score composite', re: /SCORE COMPOSITE DE CORR/i },
    ];
    blockDefs.forEach((b) => {
      const titleRow = findLabelRow(matIdx, b.re);
      if (!titleRow) return;
      const headerRowM = titleRow + 1;
      const cols = FUND_COLS.filter((c) => v(wsMat, c, headerRowM) !== '');
      const rows = [];
      for (let i = 0; i < cols.length; i++) {
        const r = headerRowM + 1 + i;
        rows.push({ label: v(wsMat, 'A', r), values: cols.map((c) => v(wsMat, c, r)) });
      }
      if (cols.length || rows.length) matrices.push({ title: b.title, cols: cols.map((c) => v(wsMat, c, headerRowM)), rows });
    });
    const synthRow = findLabelRow(matIdx, /SYNTH[EÈ]SE/i);
    if (synthRow) {
      let r = synthRow + 1;
      while (v(wsMat, 'A', r) !== '' && !/L[EÉ]GENDE/i.test(v(wsMat, 'A', r)) && r < synthRow + 25) {
        synth.push({ label: v(wsMat, 'A', r), value: v(wsMat, 'B', r) });
        r++;
      }
    }
  }

  return { funds, matrices, synth };
}
const COMPARE_SECTION_COLORS = {
  geo: 'rgba(21,59,107,0.07)',
  sect: 'rgba(166,124,45,0.09)',
  part: 'rgba(63,110,117,0.08)',
  pos: 'rgba(142,111,158,0.08)',

function ComparaisonView({ data }) {

              <tbody>
                <tr className="cb-compare-band" style={{ background: COMPARE_SECTION_COLORS.geo }}>
                  <td colSpan={funds.length + 1}>Répartition géographique</td>
                </tr>
                {[0, 1, 2, 3, 4].map((idx) => (
                  <tr key={`geo-${idx}`}>
                    <td className="cb-compare-label">{idx === 0 ? '1er pays' : `${idx + 1}e pays`}</td>

                  </tr>
                ))}
                <tr>
                  <td className="cb-compare-label">Biais géographique</td>
                  {funds.map((f, i) => (<td key={i} className="cb-compare-note">{f.biaisGeo || '—'}</td>))}
                </tr>

                <tr className="cb-compare-band" style={{ background: COMPARE_SECTION_COLORS.sect }}>
                  <td colSpan={funds.length + 1}>Répartition sectorielle</td>
                </tr>
                {[0, 1, 2, 3, 4].map((idx) => (

                    <td className="cb-compare-label">{idx === 0 ? '1er secteur' : `${idx + 1}e secteur`}</td>

                {funds.some((f) => f.particularites) && (
                  <>
                    <tr className="cb-compare-band" style={{ background: COMPARE_SECTION_COLORS.part }}>
                      <td colSpan={funds.length + 1}>Particularités</td>

                    <tr>
                      <td className="cb-compare-label"></td>
                      {funds.map((f, i) => (<td key={i} className="cb-compare-note">{f.particularites || '—'}</td>))}
                    </tr>
                  </>
                )}

                {maxPositions > 0 && (
                  <>
                    <tr className="cb-compare-band" style={{ background: COMPARE_SECTION_COLORS.pos }}>
                      <td colSpan={funds.length + 1}>Principales positions</td>
                    </tr>
                    {Array.from({ length: maxPositions }).map((_, idx) => (
                      <tr key={`pos-${idx}`}>
                        <td className="cb-compare-label">Position {idx + 1}</td>
                        {funds.map((f, i) => (<td key={i} className="cb-compare-note">{f.positions[idx] || '—'}</td>))}
                      </tr>
                    ))}
                  </>

                  {funds.map((f, i) => (<td key={i} className="cb-compare-note">{f.concentration || '—'}</td>))}

              </tbody>

          </div>

      )}
      {matrices.filter((m) => m.rows.length > 0).length > 0 && (
        <Section eyebrow="Diversification" title="Matrices de corrélation">
          <div className="cb-matrix-grid">
            {matrices.filter((m) => m.rows.length > 0).map((m, i) => {
              const allVals = m.rows.flatMap((r) => r.values.map((x) => num(x)).filter((n) => !isNaN(n)));
              const minVal = Math.min(...allVals);
              const maxVal = Math.max(...allVals);
              const span = maxVal - minVal || 1;
              return (
                <div key={i} className="cb-matrix-card">
                  <p className="cb-fund-block-title">{m.title}</p>
                  <table className="cb-table cb-heat-table">
                    <thead><tr><th></th>{m.cols.map((c, j) => (<th key={j}>{c}</th>))}</tr></thead>
                    <tbody>
                      {m.rows.map((r, ri) => (
                        <tr key={ri}>
                          <td className="cb-heat-label">{r.label}</td>
                          {r.values.map((val, vi) => {
                            const n = num(val);
                            const ratio = isNaN(n) ? 0 : (n - minVal) / span;
                            return <HeatCell key={vi} value={val} ratio={ratio} />;
                          })}
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              );
            })}
          </div>
        </Section>
      )}
      {synth.length > 0 && (
        <Section eyebrow="Diversification" title="Synthèse">
          <div className="cb-callout">
            {synth.map((s, i) => (<p key={i}><strong>{s.label} :</strong> {s.value}</p>))}
          </div>
        </Section>
      )}
      {funds.length === 0 && (
        <p className="cb-muted">Aucune fiche fonds trouvée dans la feuille "Comparaison OPCVM".</p>
      )}
    </>
  );
}

const ASSET_COLS = [

];
function extractSuperAllocator(wb) {
  const ws = wb.Sheets[wb.SheetNames[0]];
  const titleCol = 'D';
  const managers = [];
  for (let r = 5; r <= 80; r++) {
    const nom = v(ws, 'A', r);
    const societe = v(ws, 'C', r);
    if (!nom || !societe) break;
    const prenom = v(ws, 'B', r);
    const titre = v(ws, titleCol, r);
    const allocations = ASSET_COLS.map((a) => ({
      label: a.label, group: a.group,
      position: v(ws, a.posCol, r),
      intention: v(ws, a.intCol, r),
    }));
    managers.push({ nom, prenom, societe, titre, allocations });
  }
  const source = v(ws, 'A', 5 + managers.length + 1);
  return { managers, source };
}
const INTENTION_LABELS = { SUR: 'Surpondérer', SP: 'Sous-pondérer', N: 'Neutre', 'RETIRÉ': 'Retiré' };
function IntentionBadge({ code }) {
  const c = String(code || '').trim().toUpperCase();
  if (!c || c === 'N/A') return <span className="cb-muted">—</span>;
  const cls = c === 'SUR' ? 'cb-intent-sur' : c === 'SP' ? 'cb-intent-sp' : c === 'RETIRÉ' ? 'cb-intent-retire' : 'cb-intent-n';
  return <span className={`cb-intent-badge ${cls}`}>{INTENTION_LABELS[c] || c}</span>;
}
function tallyIntentions(codes) {
  const t = { SUR: 0, SP: 0, N: 0 };
  codes.forEach((c) => {
    const key = String(c || '').trim().toUpperCase();
    if (t[key] !== undefined) t[key] += 1;
  });
  return t;
}
function IntentionTally({ tally }) {
  return (
    <span className="cb-intent-tally">
      <span className="cb-intent-tally-sur">Sur {tally.SUR}</span>
      <span className="cb-intent-tally-sp">Sous {tally.SP}</span>
      <span className="cb-intent-tally-n">N {tally.N}</span>
    </span>
  );
}
function SuperAllocatorView({ data }) {
  const managers = (data && data.managers) || [];
  const source = data && data.source;
  if (!managers.length) return <p className="cb-muted">Aucun gérant trouvé dans le fichier.</p>;
  const groups = [];
  ASSET_COLS.forEach((a) => {

    if (!g) { g = { group: a.group, cols: [] }; groups.push(g); }

  const columnIntentionTotals = ASSET_COLS.map((_, j) => tallyIntentions(managers.map((m) => (m.allocations[j] || {}).intention)));
  const grandIntentionTotal = tallyIntentions(managers.flatMap((m) => (m.allocations || []).map((a) => a.intention)));

function excelDateStr(raw) {
  if (raw === '' || raw === null || raw === undefined) return '';
  if (typeof raw !== 'string') {
    const n = Number(raw);
    if (!isNaN(n)) {
      const date = new Date(Math.round((n - 25569) * 86400 * 1000));
      return date.toLocaleDateString('fr-FR');
    }
  }
  return String(raw);
}
const INDICES_PERIOD_COLS = ['D', 'E', 'F', 'G', 'H', 'I', 'J', 'K', 'M'];
function extractIndicateursMarches(wb) {
  const ws = wb.Sheets['Indicateurs'];
  const wsCommo = wb.Sheets['Matières premières'];
  const updatedAt = ws ? excelDateStr(v(ws, 'C', 1)) : '';
  const periodMeta = ws ? INDICES_PERIOD_COLS.map((c) => {
    const label = v(ws, c, 3);
    const type = c === 'D' ? 'raw' : /niveau/i.test(label) ? 'num' : 'pct';
    return { col: c, label, type };
  }) : [];
  const rows = [];
  if (ws) {
    let currentZone = '';
    let blankStreak = 0;
    for (let r = 4; r <= 300; r++) {
      const indice = v(ws, 'B', r);
      const zone = v(ws, 'A', r);
      if (!indice) {
        blankStreak += 1;
        if (rows.length > 0 && blankStreak > 6) break;
        continue;
      }
      blankStreak = 0;
      if (zone) currentZone = zone;
      rows.push({ zone: currentZone, indice, values: INDICES_PERIOD_COLS.map((c) => v(ws, c, r)) });
    }
  }
  const commodities = [];
  if (wsCommo) {
    for (let r = 2; r <= 60; r++) {
      const desc = v(wsCommo, 'A', r);
      if (!desc) break;
      commodities.push({
        desc,
        secteurs: v(wsCommo, 'B', r),
        zone: v(wsCommo, 'C', r),
        offre: v(wsCommo, 'D', r),
        actu: v(wsCommo, 'E', r),
      });
    }
  }
  return { updatedAt, periodMeta, rows, commodities };
}
function CommodityCard({ c }) {
  const parts = String(c.desc || '').split('. ');
  const headline = parts[0];
  const body = parts.slice(1).join('. ');
  return (
    <div className="cb-region-card">
      <div className="cb-region-head"><span className="cb-region-zone">{headline}.</span></div>
      {body && <p className="cb-fund-note" style={{ marginBottom: 12 }}>{body}</p>}
      {c.secteurs && (

          <p className="cb-fund-block-title">Zone géographique</p>

        </div>
      )}
      {c.offre && (
        <div className="cb-fund-block" style={{ padding: 0 }}>

      {c.actu && <div className="cb-callout" style={{ marginTop: 12 }}><p>{c.actu}</p></div>}

// ============================================================
// Workspace shell (upload / stockage partagé / états)
// ============================================================
function Workspace({ storageKey, title, subtitle, hint, Icon, extractFn, RenderComponent }) {
  const [data, setData] = useState(null);
  const [loading, setLoading] = useState(true);
  const [uploading, setUploading] = useState(false);
  const [error, setError] = useState(null);
  const [uploaderName, setUploaderName] = useState('');
  const fileInputRef = useRef(null);

  useEffect(() => {
    let mounted = true;
    setLoading(true);
    loadShared(storageKey).then((res) => { if (mounted) { setData(res); setLoading(false); } });
    return () => { mounted = false; };
  }, [storageKey]);

  // Synchronisation entre navigateurs : on revérifie périodiquement le stockage partagé
  // pour que la mise à jour d'un conseiller apparaisse chez les autres sans rechargement manuel.
  useEffect(() => {
    const interval = setInterval(async () => {
      const res = await loadShared(storageKey);
      setData((prev) => {
        if (!res) return prev;
        if (!prev || res.uploadedAt !== prev.uploadedAt) return res;
        return prev;
      });
    }, 12000);
    return () => clearInterval(interval);
  }, [storageKey]);

  const handleFile = useCallback((e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    setError(null);
    setUploading(true);
    const reader = new FileReader();
    reader.onload = async (evt) => {
      try {
        const wb = XLSX.read(evt.target.result, { type: 'array' });
        const extracted = extractFn(wb);
        const payload = {
          extracted, fileName: file.name,
          uploadedBy: uploaderName.trim() || 'Non renseigné',
          uploadedAt: new Date().toISOString(),
        };
        await saveShared(storageKey, payload);
        setData(payload);
      } catch (err) {
        setError("Impossible de lire ce fichier. Vérifiez qu'il correspond bien au modèle attendu pour cet onglet.");
      } finally {
        setUploading(false);
        if (fileInputRef.current) fileInputRef.current.value = '';
      }
    };
    reader.onerror = () => { setError('La lecture du fichier a échoué.'); setUploading(false); };
    reader.readAsArrayBuffer(file);
  }, [storageKey, uploaderName, extractFn]);

  return (
    <div>
      <div className="cb-workspace-header">
        <div className="cb-workspace-title">
          <Icon size={22} color={NAVY} />
          <div>
            <h2>{title}</h2>
            <p>{subtitle}</p>
          </div>
        </div>
        <div className="cb-upload-zone">
          <input type="text" placeholder="Votre nom (optionnel)" value={uploaderName} onChange={(e) => setUploaderName(e.target.value)} className="cb-name-input" />
          <input ref={fileInputRef} type="file" accept=".xlsx,.xls" onChange={handleFile} style={{ display: 'none' }} id={`file-${storageKey}`} />
          <label htmlFor={`file-${storageKey}`} className="cb-upload-btn">
            {uploading ? <Loader2 size={16} className="cb-spin" /> : (data ? <RefreshCw size={16} /> : <Upload size={16} />)}
            {data ? 'Remplacer le fichier' : 'Importer un fichier Excel'}
          </label>
        </div>
      </div>

      {error && <div className="cb-error"><AlertCircle size={16} /> {error}</div>}

      {loading ? (
        <div className="cb-loading"><Loader2 size={20} className="cb-spin" /> Chargement…</div>
      ) : !data ? (
        <div className="cb-empty">
          <FileSpreadsheet size={40} color={INK_SOFT} />
          <p>Aucune donnée pour l'instant.</p>
          <p className="cb-empty-sub">{hint}</p>
        </div>
      ) : (
        <>
          <div className="cb-meta">
            <span><User size={13} /> {data.uploadedBy}</span>
            <span><CalendarDays size={13} /> {new Date(data.uploadedAt).toLocaleString('fr-FR')}</span>
            <span><FileSpreadsheet size={13} /> {data.fileName}</span>
          </div>
          <RenderComponent data={data.extracted} />
        </>
      )}
    </div>
  );
}

    return () => { mounted = false; };
  }, [storageKey]);

  useEffect(() => {
    const interval = setInterval(async () => {
      const res = await loadShared(storageKey);
      setData((prev) => {
        if (!res) return prev;
        if (!prev || res.uploadedAt !== prev.uploadedAt) return res;
        return prev;
      });
    }, 12000);
    return () => clearInterval(interval);
  }, [storageKey]);

  const handleFiles = useCallback((e) => {
    const files = Array.from(e.target.files || []);

    setError(null);
    setUploading(true);
    Promise.all(files.map((file) => new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve({ name: file.name, dataUrl: reader.result });
      reader.onerror = reject;
      reader.readAsDataURL(file);
    }))).then(async (images) => {
      const payload = {
        images,
        uploadedBy: uploaderName.trim() || 'Non renseigné',
        uploadedAt: new Date().toISOString(),
      };
      try {
        await saveShared(storageKey, payload);
        setData(payload);
      } catch (err) {
        setError("L'enregistrement a échoué — les images sont peut-être trop lourdes au total (limite ~5 Mo). Essayez avec moins d'images ou une résolution plus légère.");
      } finally {
        setUploading(false);
        if (fileInputRef.current) fileInputRef.current.value = '';
      }
    }).catch(() => {
      setError('La lecture des images a échoué.');
      setUploading(false);
    });
  }, [storageKey, uploaderName]);

  return (
    <div>
      <div className="cb-workspace-header">

            {uploading ? <Loader2 size={16} className="cb-spin" /> : (data ? <RefreshCw size={16} /> : <Upload size={16} />)}
            {data ? 'Remplacer les images' : 'Importer les images du diaporama'}
          </label>
        </div>
      </div>

      {error && <div className="cb-error"><AlertCircle size={16} /> {error}</div>}

      {loading ? (
        <div className="cb-loading"><Loader2 size={20} className="cb-spin" /> Chargement…</div>
      ) : !data || !data.images || !data.images.length ? (
        <div className="cb-empty">
          <FileSpreadsheet size={40} color={INK_SOFT} />
          <p>Aucune donnée pour l'instant.</p>
          <p className="cb-empty-sub">{hint}</p>
        </div>
      ) : (
        <>
          <div className="cb-meta">
            <span><User size={13} /> {data.uploadedBy}</span>
            <span><CalendarDays size={13} /> {new Date(data.uploadedAt).toLocaleString('fr-FR')}</span>
            <span><FileSpreadsheet size={13} /> {data.images.length} image{data.images.length > 1 ? 's' : ''}</span>
          </div>
          <div className="cb-image-gallery">
            {data.images.map((img, i) => (
              <div key={i} className="cb-image-card">
                <img src={img.dataUrl} alt={img.name} />
                <p className="cb-image-caption">{img.name}</p>
              </div>
            ))}
          </div>
        </>
      )}
    </div>
  );
}

      const payload = {
        name: file.name, size: file.size, dataUrl: reader.result,
        uploadedBy: uploaderName.trim() || 'Non renseigné',
        uploadedAt: new Date().toISOString(),
      };
      try {
        await saveShared(storageKey, payload);
        setData(payload);
      } catch (err) {
        setError("L'enregistrement a échoué — le fichier est peut-être trop volumineux (limite ~5 Mo une fois encodé).");
      } finally {
        setUploading(false);
        if (fileInputRef.current) fileInputRef.current.value = '';
      }
    };
    reader.onerror = () => { setError('La lecture du fichier a échoué.'); setUploading(false); };
    reader.readAsDataURL(file);
  }, [storageKey, uploaderName]);

  return (
    <div className="cb-pptx-box">
      <div className="cb-pptx-box-head">
        <div>
          <p className="cb-fund-block-title" style={{ marginBottom: 4 }}>Fichier original (PowerPoint)</p>
          {loading ? (
            <p className="cb-muted" style={{ margin: 0 }}>Chargement…</p>
          ) : data ? (
            <a className="cb-pptx-download" href={data.dataUrl} download={data.name}>
              <FileSpreadsheet size={16} /> {data.name}
              <span className="cb-muted">({(data.size / 1024 / 1024).toFixed(1)} Mo)</span>
            </a>
          ) : (
            <p className="cb-muted" style={{ margin: 0 }}>Aucun fichier déposé.</p>
          )}
        </div>
        <div className="cb-upload-zone">
          <input type="text" placeholder="Votre nom (optionnel)" value={uploaderName} onChange={(e) => setUploaderName(e.target.value)} className="cb-name-input" />
          <input ref={fileInputRef} type="file" accept=".pptx,.ppt" onChange={handleFile} style={{ display: 'none' }} id={`file-${storageKey}`} />
          <label htmlFor={`file-${storageKey}`} className="cb-upload-btn">
            {uploading ? <Loader2 size={16} className="cb-spin" /> : (data ? <RefreshCw size={16} /> : <Upload size={16} />)}
            {data ? 'Remplacer le fichier' : 'Déposer le PowerPoint'}
          </label>
        </div>
      </div>
      {error && <div className="cb-error" style={{ marginTop: 10, marginBottom: 0 }}><AlertCircle size={16} /> {error}</div>}
      {data && (
        <div className="cb-meta" style={{ marginTop: 10, marginBottom: 0 }}>
          <span><User size={13} /> {data.uploadedBy}</span>
          <span><CalendarDays size={13} /> {new Date(data.uploadedAt).toLocaleString('fr-FR')}</span>
        </div>
      )}
    </div>
  );
}
